# Keeps the free Supabase project from being paused for inactivity: one tiny database query every 3 days.
name: Datenbank wach halten

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -fsS -X POST "https://ikmuivznwysbxlwxzxrd.supabase.co/rest/v1/rpc/team_preview" \
            -H "apikey: sb_publishable_ptC5If9CNCCN_UxoGGVLfA_LMU9o_QM" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE"}'
