<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hear Me Coach</title>
<meta name="theme-color" content="#0b4d33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: sideline clipboard, quick and friendly, calm
   IDEA: the club's own colours on a clean team sheet; the header carries the sport's field markings
   PICTURE: the live pool of shared clips with upvote meters filling toward the coach line
   COLOUR and TYPE: team colour band (from sport or club), quiet paper, signal coral accent; Barlow Condensed + Barlow
   LAYOUT: app shell, coloured top band, tabs on paper, single card column, floating share button */
:root{color-scheme:light dark;
  --bg:#1f6b46;--chalk:#ffffff; /* team colour + text on it, set by applyTheme() */
  --paper:light-dark(#f4f5f2,#0f1311);
  --card:light-dark(#ffffff,#182019);--ink:light-dark(#151a17,#e8eee9);--soft:light-dark(#5d6862,#9fb0a6);
  --line:light-dark(#e2e6e1,#2a352e);--acc:#ff5a3c;--acc2:light-dark(#ffe9e3,#3a1d16);
  --ok:light-dark(#0f7a4a,#5fd39a);--okbg:light-dark(#e6f4ec,#12321f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;font-size:16px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:16px max(4vw,14px) 18px;
  background:var(--bg);color:var(--chalk)}
.top .motif{position:absolute;right:-10px;top:-10px;height:calc(100% + 20px);width:auto;opacity:.16;pointer-events:none}
.top .logo{flex:none;width:52px;height:52px;border-radius:14px;object-fit:contain;background:#fff;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.top .mark{flex:none;width:44px;height:44px}
.top .names{position:relative;min-width:0;flex:1}
.mode{position:relative;flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:12px;border:0;
  background:color-mix(in srgb,var(--chalk) 18%,transparent);color:var(--chalk);font-weight:600;font-size:14px}
.mode svg{width:20px;height:20px}
.hero .mode{margin-left:auto}
.hero .row{flex-wrap:nowrap}
@media(max-width:520px){.mode span{display:none}.mode{padding:0 10px}}
.top h1{font-size:26px;letter-spacing:.01em;overflow-wrap:anywhere}
.top .sub{font-size:14px;opacity:.85}
.tabs{display:flex;gap:6px;padding:10px max(4vw,14px);overflow-x:auto;position:sticky;top:0;z-index:4;
  background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tab{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-weight:600}
.tab[aria-selected=true]{background:var(--bg);color:var(--chalk);border-color:var(--bg)}
.tab .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px}
main{max-width:720px;margin:0 auto;padding:6px max(4vw,14px) 120px}
.hint{color:var(--soft);font-size:14px;margin:14px 2px 12px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 14px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05)}
.post{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px}
.thumb{width:96px;height:128px;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#fff;
  font-family:"Barlow Condensed";font-weight:700;font-size:18px;text-decoration:none;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .pl{position:absolute;left:6px;bottom:6px;font-size:12px;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px}
.p-tiktok{background:linear-gradient(150deg,#111 40%,#25f4ee 60%,#fe2c55)}
.p-instagram{background:linear-gradient(140deg,#feda75,#d62976 55%,#4f5bd5)}
.p-youtube{background:#e62117}.p-facebook{background:#1877f2}.p-web{background:#4b5a52}
.meta{font-size:14px;color:var(--soft);display:flex;flex-wrap:wrap;gap:4px 10px}
.title{font-size:19px;font-weight:600;margin:2px 0 4px;overflow-wrap:anywhere}
.comment{margin:4px 0 8px;font-size:15px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:13px;font-weight:600;background:var(--line);color:var(--ink)}
.s-relevant{background:var(--acc2);color:var(--acc)}.s-adopted{background:var(--okbg);color:var(--ok)}
.s-rejected{background:var(--line);color:var(--soft)}.s-seen{background:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vote{display:flex;align-items:center;gap:10px;margin-top:8px}
.up{min-height:44px;min-width:76px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font-weight:700}
.up[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.up:disabled{opacity:.5;cursor:default}
.meter{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:4px;transition:width .3s}
.mlab{font-size:13px;color:var(--soft);white-space:nowrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--bg);color:var(--chalk);font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.acc{background:var(--acc);color:#fff}
.link{color:inherit;font-weight:600}
.fab{position:fixed;right:max(4vw,16px);bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;min-height:56px;padding:0 22px;border-radius:999px;
  border:0;background:var(--acc);color:#fff;font-weight:700;font-size:17px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=url],input[type=number],textarea,select{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.switch{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--acc)}
.small{font-size:14px;color:var(--soft)}
.sheet{position:fixed;inset:0;z-index:10;display:none;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .card{width:min(640px,100%);margin:0;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:28px}
.review{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--line)}
.stars button{min-width:44px;min-height:44px;border:0;background:transparent;font-size:26px;color:var(--line);padding:0}
.stars button.on{color:#f5a623}
.empty{color:var(--soft);text-align:center;padding:40px 10px}.empty h2{color:var(--ink)}
.empty h2{font-size:30px;margin-bottom:6px}
.code{font-family:"Barlow Condensed";font-size:34px;letter-spacing:.12em;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:20;background:#13201a;color:#fff;padding:10px 16px;border-radius:12px;
  font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
.demo[hidden]{display:none}
.demo{background:var(--acc);color:#fff;font-size:14px;padding:8px max(4vw,14px);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo select{width:auto;min-height:36px;padding:4px 8px;font-size:15px}
.hero{color:#fff;background:var(--bg);margin:0 calc(-1 * max(4vw,14px)) 16px;padding:28px max(4vw,14px) 18px}
.hero h1{font-size:clamp(40px,10vw,56px)}
.hero p{font-size:18px;opacity:.9;max-width:34em}
.board{display:block;width:100%;height:auto;margin:10px 0 6px}
.sess h3{font-size:24px;margin:4px 0 2px}.sess .when{font-weight:600;color:var(--soft)}
.sess.draft{border-style:dashed}.sess .items{margin:10px 0 6px;padding-left:1.3em}.sess .items li{margin:6px 0}
.rate{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.rate b{font-family:"Barlow Condensed";font-size:28px}.srow{color:#f5a623;letter-spacing:1px}.srow span{color:var(--line)}
.cmts{margin:6px 0;padding-left:1.2em}
.pickl{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:6px}
.pickrow{display:grid;grid-template-columns:28px minmax(0,1fr) 78px;align-items:center;gap:8px;margin:0;font-weight:500;padding:4px}
.pickrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--bg)}.pickrow input[type=number]{min-height:38px;padding:6px 8px}
.toggles .switch{margin-top:8px;font-weight:500}
.install{border:2px solid var(--acc)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.dhead select{width:auto;max-width:55%}
.dstats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--soft);font-weight:600}.dstats .good{color:var(--ok)}
.rank{font-family:"Barlow Condensed";font-weight:700;font-size:18px;color:var(--ink)}
.mlist{list-style:none;margin:8px 0 0;padding:0}.mlist li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.mlist li.dup{background:var(--acc2);border-radius:10px;padding:10px}.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.warn{color:var(--acc);font-weight:600}.warnline{color:var(--acc);font-weight:600}
.qrbox{display:block;width:150px;height:150px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;cursor:zoom-in}
.qrbox svg{display:block;width:100%;height:100%}.qrbox svg rect[fill="white"],.qrbox svg path{shape-rendering:crispEdges}
.invgrid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
@media(max-width:420px){.invgrid{grid-template-columns:1fr}.invgrid .qrbox{margin:0 auto}}
.qrbig{text-align:center}.qrbig .qrbox{width:min(78vw,340px);height:min(78vw,340px);margin:14px auto;cursor:default}
.codebox{white-space:nowrap;font-size:clamp(22px,7vw,36px);margin:10px 0;padding:10px 14px;border:2px dashed var(--acc);border-radius:12px;text-align:center}
.ack{margin-top:14px;padding:10px;border-radius:10px;background:var(--acc2)}
@media(min-width:1000px){
  .top,.tabs{padding-left:max(4vw,calc((100% - 1040px)/2));padding-right:max(4vw,calc((100% - 1040px)/2))}
  main{max-width:1040px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.grid .card{margin:0}
  .tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.tgrid .card{margin:0}
  .sheet{align-items:center}.sheet .card{border-radius:18px;max-height:88vh}
  .fab{right:max(4vw,calc((100% - 1040px)/2))}
  .hero{border-radius:0 0 18px 18px}
}.install h3{font-size:22px;margin-bottom:6px}.install ol{margin:6px 0;padding-left:1.3em}.install li{margin:4px 0}
.ico{width:18px;height:18px;vertical-align:-3px}.nowrap{white-space:nowrap}
.steps{margin:6px 0;padding-left:1.3em}.steps li{margin:6px 0}
.keybox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;padding:10px;border:1.5px dashed var(--line);border-radius:10px;overflow-wrap:anywhere;margin:8px 0}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pick{min-height:40px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600}
.pick[aria-pressed=true]{background:var(--bg);border-color:var(--bg);color:var(--chalk)}
.pick.new{border-style:dashed}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.filters .pick{flex:none;background:var(--card)}
.filters .pick[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.cat{display:inline-block;padding:1px 8px;border-radius:6px;font-size:13px;font-weight:600;background:var(--bg);color:var(--chalk)}
.catlist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.catlist span{display:inline-flex;align-items:center;gap:2px;padding-left:12px;border-radius:999px;border:1.5px solid var(--line);font-weight:600}
.stars.mini{display:flex;margin-top:4px}.stars.mini button{min-width:40px;min-height:40px;font-size:24px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.kpis div{background:var(--okbg);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.kpis b{font-family:"Barlow Condensed";font-size:clamp(28px,8vw,40px);line-height:1;color:var(--ok)}
.kpis span{font-size:13px;color:var(--soft)}
@media(max-width:420px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.weeks{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:170px;align-items:end;margin-top:10px}
.wk{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.wk i{display:block;width:100%;max-width:26px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.wn{font-size:13px;font-weight:600;color:var(--soft)}.wl{font-size:11px;color:var(--soft);margin-top:4px;white-space:nowrap}
@media(max-width:420px){.wl{font-size:9px}}
.bar{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.5em;gap:8px;align-items:center;margin:8px 0}
.bar div{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bg)}
.bar b{text-align:right}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top5{margin:8px 0;padding-left:1.4em}.top5 li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.top5 b{white-space:nowrap}
.catlist button{min-width:40px;min-height:40px;border:0;background:transparent;color:var(--soft);font-size:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="demo" class="demo" hidden></div>
<div id="app"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true"><div class="card" id="sheetBody"></div></div>
<div id="toast" class="toast" role="status"></div>

    b.setAttribute('aria-pressed', on); box.dataset.val = on ? b.dataset.c : ''; inp.hidden = true; inp.value = ''; });

}

const token = () => demo ? 'demo' : store.get('token');

async function load(){
  try {

    S.posts = await api.call('list_posts', {p_token:token()});
    if (S.tab === 'stats') S.log = await api.call('list_my_log', {p_token:token()});
    if (S.tab === 'discover') {
      if (!S.discSports) S.discSports = await api.call('discover_sports', {p_token:token()}).catch(() => []);
      S.disc = await api.call('discover', {p_token:token(), p_sport:S.discSport || null, p_days:S.discDays === undefined ? 30 : S.discDays, p_sort:S.discSort || 'popular'});
    }
    if (S.tab === 'training' && S.me.team.mode === 'team') S.sessions = await api.call('list_sessions', {p_token:token()});
    if (S.tab === 'team' && S.me.team.mode === 'team' && !demo) S.prefs = await api.call('get_notify_prefs', {p_token:token()}).catch(() => null);
    if (S.tab === 'team' && S.me.team.mode === 'team' && S.me.role === 'coach') S.members = await api.call('list_members', {p_token:token()}).catch(() => null);

// ---------- views ----------
const isSolo = () => S.me && S.me.team.mode === 'solo';
const SOLO_STATUS = {new:'Neu', seen:'Okay', adopted:'Favorit', rejected:'Nicht meins', relevant:'Neu'};
const fmtDay = iso => new Date(iso).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'});
const SORTS = {new:'Neueste', stars:'Beste Bewertung', done:'Am häufigsten gemacht', stale:'Am längsten nicht gemacht'};

function sortList(list){
  const s = S.sort || 'new', t = p => p.last_done ? Date.parse(p.last_done) : 0;
  const by = {new:(a,b) => Date.parse(b.created_at) - Date.parse(a.created_at),
    stars:(a,b) => ((b.review && b.review.stars) || 0) - ((a.review && a.review.stars) || 0),
    done:(a,b) => (b.done_count || 0) - (a.done_count || 0), stale:(a,b) => t(a) - t(b)}[s];
  return list.slice().sort(by);
}

function render(){
  const app = $('#app');
  if (!S.me) { applyTheme(null); app.innerHTML = onboarding(); bindOnboarding(); bindMode(); return; }
  const coach = S.me.role === 'coach', solo = isSolo(), theme = applyTheme(S.me.team);
  const relevantOpen = S.posts.filter(p => p.status === 'relevant').length;
  const tabs = solo
    ? [['all','Sammlung'], ['fav','Favoriten'], ['discover','Entdecken'], ['stats','Statistik'], ['team','Einstellungen']]
    : [['pool','Pool'], ...(coach ? [['coach','Coach', relevantOpen]] : []), ['training','Training'], ['discover','Entdecken'], ['mine','Meine'], ['stats','Statistik'], ['team','Team']];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  let list = S.posts, hint = '';
  if (S.tab === 'all') { list = S.posts.filter(p => p.status !== 'rejected'); hint = 'Deine Übungen. Bewerte sie mit Sternen und tippe nach dem Training auf „Gemacht“.'; }
  if (S.tab === 'fav') { list = S.posts.filter(p => p.status === 'adopted'); hint = 'Was du als Favorit markiert hast.'; }
  if (S.tab === 'pool') { list = S.posts.filter(p => p.status !== 'adopted' && p.status !== 'rejected');
    hint = `Upvote, was ihr trainieren wollt. Ab ${S.me.team.threshold} Upvotes landet es beim Coach.`; }
  if (S.tab === 'coach') { list = ['relevant','new','seen','rejected'].flatMap(s => S.posts.filter(p => p.status === s));
    hint = 'Oben: hat die Schwelle erreicht. Darunter: neu, angeschaut, abgelehnt.'; }
  if (S.tab === 'training') { list = S.posts.filter(p => p.status === 'adopted'); hint = 'Übungs-Sammlung: vom Coach ins Training aufgenommen. Tippe auf „Gemacht“, wenn du sie trainiert hast.'; }
  if (S.tab === 'mine') { list = S.posts.filter(p => p.mine); hint = 'Deine geteilten Links und was der Coach dazu sagt.'; }
  if (solo && S.tab !== 'stats' && S.tab !== 'team') list = sortList(list);
  const usedCats = [...new Set(list.map(p => p.category).filter(Boolean))];
  if (S.cat && !usedCats.includes(S.cat)) S.cat = '';

  const filters = usedCats.length > 1 ? `<div class="filters" role="group" aria-label="Kategorie">
      <button class="pick" data-f="" aria-pressed="${!S.cat}">Alle</button>
      ${usedCats.map(c => `<button class="pick" data-f="${esc(c)}" aria-pressed="${S.cat === c}">${esc(c)}</button>`).join('')}</div>` : '';
  const sorter = solo ? `<div class="row" style="margin:0 0 12px"><label for="sort" class="small" style="margin:0">Sortieren</label>
      <select id="sort" style="width:auto;flex:1">${Object.entries(SORTS).map(([k,l]) => `<option value="${k}" ${k === (S.sort || 'new') ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` : '';
  const body = S.tab === 'team' ? '<div class="tgrid">' + teamView(coach) + '</div>' : S.tab === 'stats' ? statsView() : S.tab === 'discover' ? discoverView()
    : `${S.tab === 'training' && !solo ? sessionsBlock(coach) + '<h2 style="font-size:24px;margin:22px 2px 0">Übungen</h2>' : ''}<p class="hint">${esc(hint)}</p>${filters}${sorter}${list.length ? '<div class="grid">' + list.map(postCard).join('') + '</div>' : emptyView()}`;
  app.innerHTML = `
    <header class="top">${motifSvg(theme.motif)}
      ${S.me.team.logo ? `<img class="logo" src="${esc(S.me.team.logo)}" alt="">` : LOGO}
      <div class="names"><h1>${esc(S.me.team.name)}</h1>
        <div class="sub">${esc(S.me.team.sport)} · ${esc(S.me.name)}${solo ? '' : ' · ' + (coach ? 'Coach' : 'Spieler')} · Hear Me Coach</div></div>${modeBtn()}</header>
    <nav class="tabs" role="tablist">${tabs.map(([k,l,n]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</nav>
    <main>${codeBanner()}${S.tab === 'team' || S.tab === 'stats' ? '' : installBanner()}${body}</main>
    <button class="fab" id="fab">${solo ? '+ Video speichern' : '+ Link teilen'}</button>`;
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = async () => { S.tab = b.dataset.tab; S.cat = '';
    if (S.tab === 'stats' || S.tab === 'training' || S.tab === 'team' || S.tab === 'discover') return load().then(() => scrollTo(0, 0));
    render(); scrollTo(0,0); });
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.cat = b.dataset.f; render(); });

  $('#fab').onclick = () => openShare('');

function emptyView(){
  const t = {pool:['Noch leer','Teile das erste Video aus TikTok oder Instagram.'], coach:['Alles gesichtet','Sobald etwas die Schwelle erreicht, taucht es hier auf.'],
    training:['Noch nichts aufgenommen','Der Coach entscheidet, was ins Training kommt.'], mine:['Du hast noch nichts geteilt','Tippe auf „+ Link teilen“.'],

function postCard(p){
  const coach = S.me.role === 'coach', solo = isSolo(), th = S.me.team.threshold, pct = Math.min(100, p.upvotes / th * 100);

      </div>${coach && p.voters && p.voters.length ? `<div class="small" style="margin-top:6px">Upvotes von: ${p.voters.map(esc).join(', ')}</div>` : ''}`;

// ---------- training sessions (team mode) ----------
const fmtWhen = (iso, min) => { const d = new Date(iso), e = new Date(d.getTime() + (min || 90) * 6e4);
  const day = d.toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit'});
  const hm = x => x.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
  return `${day} · ${hm(d)}–${hm(e)}`; };
const starRow = n => `<span class="srow" aria-label="${n} von 5 Sternen">${'★'.repeat(Math.round(n))}<span>${'★'.repeat(5 - Math.round(n))}</span></span>`;
function sessionsBlock(coach){
  const ss = S.sessions || [], now = Date.now();
  const end = s => Date.parse(s.starts_at) + s.duration_min * 6e4;
  const upcoming = ss.filter(s => end(s) >= now).sort((a, b) => Date.parse(a.starts_at) - Date.parse(b.starts_at));
  const past = ss.filter(s => end(s) < now);
  const head = `<div class="row" style="justify-content:space-between;margin:14px 2px 10px"><h2 style="font-size:26px">Trainingsplan</h2>
    ${coach ? '<button class="btn" id="newSess">+ Neue Einheit</button>' : ''}</div>`;
  if (!ss.length) return head + `<p class="hint" style="margin-top:0">${coach ? 'Stell aus den aufgenommenen Videos eine Einheit zusammen und veröffentliche sie. Die Mannschaft sieht dann, was als Nächstes kommt.' : 'Noch kein Training geplant. Sobald der Coach eine Einheit veröffentlicht, steht sie hier.'}</p>`;
  return head + upcoming.map((s, i) => sessCard(s, coach, i === 0 ? 'Nächstes Training' : '')).join('')
    + (past.length ? `<h3 style="font-size:20px;margin:18px 2px 10px">Vergangene Einheiten</h3>` + past.map(s => sessCard(s, coach, '')).join('') : '');
}
function sessCard(s, coach, label){
  const draft = s.status === 'draft';
  const rate = s.ratable ? `<div class="rate">
      ${s.rating_count ? `<b>${String(s.rating_avg).replace('.', ',')}</b> ${starRow(s.rating_avg)} <span class="small">${s.rating_count} ${s.rating_count === 1 ? 'Bewertung' : 'Bewertungen'}</span>` : '<span class="small">Noch keine Bewertung</span>'}
      <button class="btn ${s.my_rating ? 'alt' : 'acc'}" data-rates="${esc(s.id)}">${s.my_rating ? 'Deine: ' + '★'.repeat(s.my_rating.stars) : 'Training bewerten'}</button></div>
      ${coach && s.comments && s.comments.length ? `<details class="small"><summary class="link">${s.comments.length} Kommentar${s.comments.length > 1 ? 'e' : ''} (anonym)</summary>
        <ul class="cmts">${s.comments.map(c => `<li>${'★'.repeat(c.stars)} ${esc(c.comment)}</li>`).join('')}</ul></details>` : ''}` : '';
  return `<article class="card sess ${draft ? 'draft' : ''}">
    <div class="meta">${label ? `<span class="chip s-relevant">${label}</span>` : ''}${draft ? '<span class="chip">Entwurf, nur für dich sichtbar</span>' : ''}</div>
    <h3>${esc(s.title)}</h3>
    <div class="when">${fmtWhen(s.starts_at, s.duration_min)}${s.place ? ' · ' + esc(s.place) : ''}</div>
    ${s.items.length ? `<ol class="items">${s.items.map(it => `<li><a class="link" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title || (PL[it.platform] || 'Video'))}</a>
      ${it.minutes ? `<span class="small nowrap">${it.minutes} Min.</span>` : ''}${it.category ? ` <span class="cat">${esc(it.category)}</span>` : ''}${it.note ? `<div class="small">${esc(it.note)}</div>` : ''}</li>`).join('')}</ol>` : ''}
    ${s.note ? `<p class="small">${esc(s.note)}</p>` : ''}
    ${rate}
    ${coach ? `<div class="row" style="margin-top:10px">${draft ? `<button class="btn acc" data-pub="${esc(s.id)}">Veröffentlichen</button>` : ''}
      <button class="btn alt" data-edsess="${esc(s.id)}">Bearbeiten</button><button class="btn alt" data-delsess="${esc(s.id)}">Löschen</button></div>` : ''}
  </article>`;

const toLocalInput = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);

// ---------- statistics (computed from my own log) ----------
function weekStart(t){ const d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
function statsView(){
  const log = S.log || [];
  if (!log.length) return `<div class="empty"><h2>Noch keine Einträge</h2><p>Tippe nach dem Training bei einer Übung auf „✓ Gemacht“. Hier siehst du dann, wie oft und was du trainiert hast.</p></div>`;
  const now = Date.now(), W = 7*864e5, thisWeek = weekStart(now);
  const weeks = Array.from({length:12}, (_, i) => weekStart(thisWeek - (11 - i) * W + 432e5)); // +12h keeps DST shifts inside the right week
  const perWeek = weeks.map(w => log.filter(l => weekStart(Date.parse(l.done_at)) === w).length);
  const days = new Set(log.map(l => new Date(l.done_at).toDateString()));
  const daysThisWeek = new Set(log.filter(l => Date.parse(l.done_at) >= thisWeek).map(l => new Date(l.done_at).toDateString())).size;
  let streak = 0; for (let i = perWeek.length - 1; i >= 0; i--) { if (perWeek[i]) streak++; else if (i === perWeek.length - 1) continue; else break; }
  const count = key => Object.entries(log.reduce((m, l) => { const k = l[key] || 'Ohne Kategorie'; m[k] = (m[k] || 0) + 1; return m; }, {})).sort((a,b) => b[1] - a[1]);
  const byCat = count('category');
  const byPost = Object.values(log.reduce((m, l) => { (m[l.post_id] = m[l.post_id] || {title:l.title || 'Video', n:0, last:l.done_at}).n++; return m; }, {})).sort((a,b) => b.n - a.n).slice(0, 5);
  const max = Math.max(1, ...perWeek), maxC = Math.max(1, ...byCat.map(c => c[1]));
  const lastDays = [...days].map(d => Date.parse(d)).sort((a,b) => b - a);
  const stale = S.posts.filter(p => p.status !== 'rejected' && p.done_count && Date.parse(p.last_done) < now - 14*864e5);
  return `<section class="card"><h2 style="font-size:26px">Dein Training</h2>
      <div class="kpis">
        <div><b>${days.size}</b><span>Trainingstage</span></div>
        <div><b>${log.length}</b><span>Übungen gemacht</span></div>
        <div><b>${daysThisWeek}</b><span>Tage diese Woche</span></div>
        <div><b>${streak}</b><span>Wochen in Folge</span></div></div>
      <p class="small">Letztes Training: ${lastDays.length ? new Date(lastDays[0]).toLocaleDateString('de-DE', {weekday:'long', day:'2-digit', month:'2-digit'}) : '–'}</p></section>
    <section class="card"><h3 style="font-size:22px">Übungen pro Woche</h3>
      <div class="weeks" role="img" aria-label="Übungen pro Woche, letzte 12 Wochen">
        ${perWeek.map((n, i) => `<div class="wk"><span class="wn">${n || ''}</span><i style="height:${n / max * 100}%"></i>
          <span class="wl">${i === 11 ? 'jetzt' : 'KW' + kw(weeks[i])}</span></div>`).join('')}</div></section>
    <section class="card"><h3 style="font-size:22px">Nach Kategorie</h3>
      ${byCat.map(([c, n]) => `<div class="bar"><span>${esc(c)}</span><div><i style="width:${n / maxC * 100}%"></i></div><b>${n}</b></div>`).join('')}</section>
    <section class="card"><h3 style="font-size:22px">Am häufigsten</h3>
      <ol class="top5">${byPost.map(p => `<li><span>${esc(p.title)}</span><b>${p.n}×</b></li>`).join('')}</ol>
      ${stale.length ? `<p class="small"><b>Länger nicht gemacht:</b> ${stale.slice(0, 4).map(p => esc(p.title || 'Video')).join(', ')}</p>` : ''}</section>`;
}
function kw(t){ const d = new Date(t); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); const y = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - y) / 864e5 - 3 + ((y.getDay() + 6) % 7)) / 7); }

// ---------- sheets ----------
function sheet(html){ $('#sheetBody').innerHTML = html; $('#sheet').classList.add('open'); }
function closeSheet(){ $('#sheet').classList.remove('open'); }
$('#sheet').addEventListener('click', e => { if ((e.target.id === 'sheet' && !S.lockSheet) || e.target.dataset.close != null) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !S.lockSheet) closeSheet(); });
document.addEventListener('paste', e => {
  if (!S.me || $('#sheet').classList.contains('open') || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName)) return;
  const u = firstUrl(e.clipboardData && e.clipboardData.getData('text')); if (u) { e.preventDefault(); openShare(u); } });

function confirmSheet(title, text, label, fn){
  sheet(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row"><button class="btn acc" id="ok">${esc(label)}</button><button class="btn alt" data-close>Abbrechen</button></div>`);
  $('#ok').onclick = async () => { try { if (await fn() !== 'keep') closeSheet(); } catch (e) { toast(e.message); } };
}

function openShare(prefill){
  const solo = isSolo();
  sheet(`<h2>${solo ? 'Video speichern' : 'Hear me, Coach!'}</h2>
    <form id="shareForm">
      <label for="u">Link zum Video</label>
      <div class="row" style="flex-wrap:nowrap"><input id="u" type="url" inputmode="url" placeholder="https://www.tiktok.com/…" value="${esc(prefill)}" required style="flex:1">
        ${navigator.clipboard && navigator.clipboard.readText ? '<button type="button" class="btn" id="pasteBtn">Einfügen</button>' : ''}</div>
      <p class="small" id="pv"></p>
      <label for="ti">Titel <span class="small">(was ist zu sehen?)</span></label>
      <input id="ti" type="text" maxlength="200" placeholder="${solo ? 'z. B. Kniebeuge mit Pause' : 'z. B. Passübung im Dreieck'}">
      <label>Kategorie</label>${catPicker('cp', S.me.team.categories, '')}
      <label for="co">${solo ? 'Notiz' : 'Warum sollten wir das machen?'} <span class="small">(optional)</span></label>
      <textarea id="co" maxlength="500" placeholder="${solo ? 'z. B. 3 × 10, langsam runter' : ''}"></textarea>
      ${solo ? '' : `<label class="switch"><input id="an" type="checkbox"> Anonym teilen</label>
      <p class="small">Mitspieler sehen dann keinen Namen. Der Coach sieht immer, von wem es kommt.</p>`}
      <div class="row" style="margin-top:14px"><button class="btn acc" type="submit">${solo ? 'Speichern' : 'In den Pool'}</button><button class="btn alt" type="button" data-close>Abbrechen</button></div>
    </form>`);
  let pv = {}; const cat = bindCatPicker('cp');
  const check = async () => {
    const u = firstUrl($('#u').value); if (!u) return;
    $('#u').value = u; $('#pv').textContent = PL[platformOf(u)] + '-Link erkannt';
    pv = await preview(u); if (pv.title && !$('#ti').value) $('#ti').value = pv.title.slice(0, 200);
  };
  $('#u').addEventListener('change', check); $('#u').addEventListener('paste', () => setTimeout(check, 0));
  const pb = $('#pasteBtn'); if (pb) pb.onclick = async () => {
    try { const t = firstUrl(await navigator.clipboard.readText()); if (!t) return toast('In der Zwischenablage ist kein Link.'); $('#u').value = t; check(); }
    catch { toast('Bitte lange ins Feld tippen und „Einfügen“ wählen.'); } };
  if (prefill) check(); else if (!pb) setTimeout(() => $('#u').focus(), 50);
  $('#shareForm').onsubmit = async e => {
    e.preventDefault();
    const u = firstUrl($('#u').value); if (!u) return toast(ERR.invalid_url);
    try {
      const r = await api.call('add_post', {p_token:token(), p_url:u, p_title:$('#ti').value, p_thumbnail_url:pv.thumb || null,
        p_comment:$('#co').value, p_anonymous: !solo && $('#an').checked, p_category:cat() || null});
      closeSheet();
      toast(r.duplicate ? (solo ? 'Das Video ist schon in deiner Sammlung.' : 'Den Link gibt es schon im Pool, gib ihm ein Upvote.')
        : (solo ? 'Gespeichert.' : 'Im Pool! Jetzt brauchst du Upvotes.'));
      S.tab = solo ? 'all' : 'pool'; await load();
    } catch (err) { toast(err.message); }
  };
}

function openReview(p){
  const r = p.review || {}, solo = isSolo(); let stars = r.stars || 0;
  sheet(`<h2>${esc(p.title || 'Beitrag')}</h2>
    <p class="small">${solo ? '' : `Geteilt von <b>${esc(p.submitter || '?')}</b>${p.anonymous ? ' (anonym für Mitspieler)' : ''} · ${p.upvotes} Upvotes · `}
      <a class="link" href="${esc(p.url)}" target="_blank" rel="noopener">Video öffnen</a></p>
    <label>Kategorie</label>${catPicker('rc', S.me.team.categories, p.category || '')}
    <label>${solo ? 'Wie gefällt dir die Übung?' : 'Deine Bewertung'}</label><div class="stars" id="st">${[1,2,3,4,5].map(i => `<button type="button" data-s="${i}" aria-label="${i} Sterne">★</button>`).join('')}</div>
    <label for="no">Notiz</label><textarea id="no" maxlength="2000" placeholder="${solo ? 'z. B. 3 × 10 mit 60 kg' : 'z. B. Dienstag Block 2, mit kleineren Feldern'}">${esc(r.note || '')}</textarea>
    ${solo ? '' : `<label class="switch"><input id="np" type="checkbox" ${r.note_public ? 'checked' : ''}> Notiz für die Mannschaft sichtbar</label>
    <label for="rs">Grund bei Ablehnung <span class="small">(sieht nur der Absender)</span></label>
    <input id="rs" type="text" maxlength="300" value="${esc(r.reason || '')}">`}
    <div class="row" style="margin-top:16px">
      <button class="btn acc" data-st="adopted">${solo ? '♥ Favorit' : 'Ins Training'}</button>
      <button class="btn" data-st="seen">${solo ? 'Okay' : 'Angeschaut'}</button>
      <button class="btn alt" data-st="rejected">${solo ? 'Nicht meins' : 'Ablehnen'}</button></div>`);
  const cat = bindCatPicker('rc');
  const paint = () => document.querySelectorAll('#st [data-s]').forEach(b => b.classList.toggle('on', +b.dataset.s <= stars));
  document.querySelectorAll('#st [data-s]').forEach(b => b.onclick = () => { stars = +b.dataset.s; paint(); }); paint();
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
    try {
      await api.call('review_post', {p_token:token(), p_post_id:p.id, p_status:b.dataset.st, p_stars:stars || null,
        p_note:$('#no').value, p_note_public: solo ? false : $('#np').checked, p_reason: solo ? null : $('#rs').value});
      if ((cat() || '') !== (p.category || '') && cat()) await api.call('set_post_category', {p_token:token(), p_post_id:p.id, p_category:cat()});
      closeSheet(); toast('Gespeichert'); await load();
    } catch (e) { toast(e.message); } });
}

function bindOnboarding(){
  const done = r => { S.invite = null; if (!demo) store.set('token', r.token); history.replaceState(null, '', location.pathname); S.tab = r.team.mode === 'solo' ? 'all' : r.role === 'coach' ? 'coach' : 'pool';
    demoHooks.refresh(); load().then(() => { if (r.login_code) showCodeSheet(r.login_code, true); else handleShare(); }); };
  $('#loginForm').onsubmit = async e => { e.preventDefault();
    try { const r = await api.call('login_with_code', {p_code:$('#lc').value}); toast('Willkommen zurück, ' + r.name + '!'); done(r); } catch (err) { toast(err.message); } };
  $('#lc').oninput = e => { const p = e.target.selectionStart === e.target.value.length; e.target.value = fmtCode(e.target.value).slice(0, 14); };
  const join = async () => {
    try { done(await api.call('join_team', {p_code:$('#jc').value, p_name:$('#jn').value})); }
    catch (err) {
      if (err.message !== ERR.name_taken) return toast(err.message);
      const n = $('#jn').value.trim();
      sheet(`<h2>„${esc(n)}“ gibt es hier schon</h2>
        <p><b>Bist du das?</b> Dann melde dich mit deinem Zugangscode an. So bleiben deine Videos und Upvotes in einem Profil.</p>

        <input id="nt2" type="text" maxlength="40" value="${esc(n)} " placeholder="z. B. ${esc(n)} K. oder ${esc(n)} (Torwart)">
        <p class="small" id="ntHint">Bitte etwas ergänzen, z. B. „${esc(n)} K.“</p>
        <div class="row" style="margin-top:8px"><button class="btn" id="ntJoin" disabled>Mit diesem Namen beitreten</button><button class="btn alt" data-close>Abbrechen</button></div>
        <p class="small">Kein Zugangscode, weil du vor der Einführung beigetreten bist? Dann tritt mit ergänztem Namen bei und bitte deinen Coach, die beiden Profile unter „Team → Mitglieder“ zusammenzuführen.</p>`);
      const inp = $('#nt2'), ok = () => { const v = inp.value.trim(); const same = v.toLowerCase() === n.toLowerCase();
        $('#ntJoin').disabled = !v || same; $('#ntHint').style.display = same ? '' : 'none'; };
      inp.oninput = ok; ok(); setTimeout(() => { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }, 50);
      $('#ntLogin').onclick = () => { closeSheet(); const l = $('#lc'); if (l) { l.scrollIntoView({block:'center'}); l.focus(); } };
      $('#ntJoin').onclick = () => { $('#jn').value = inp.value.trim(); closeSheet(); join(); };
    } };
  $('#joinForm').onsubmit = e => { e.preventDefault(); join(false); };
  if (S.invite) { bindInstall(); setTimeout(() => $('#jn') && $('#jn').focus(), 100); return; }
  const sport = bindSportPicker();
  $('#createForm').onsubmit = async e => { e.preventDefault();
    if (!sport()) return toast('Bitte eine Sportart eingeben.');
    try { done(await api.call('create_team', {p_team_name:$('#tn').value, p_coach_name:$('#cn').value, p_sport:sport(), p_mode:'team'})); } catch (err) { toast(err.message); } };
  const ssport = bindSportPicker('ssp');
  $('#soloForm').onsubmit = async e => { e.preventDefault();
    if (!ssport()) return toast('Bitte eine Sportart eingeben.');
    try { done(await api.call('create_team', {p_team_name:'Mein Training', p_coach_name:$('#sn').value, p_sport:ssport(), p_mode:'solo'})); } catch (err) { toast(err.message); } };
  const code = new URLSearchParams(location.search).get('code'); if (code) $('#jc').value = code;
  if (STANDALONE && !code) setTimeout(() => $('#lc').focus(), 100);
  bindInstall();
}

addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.me) render(); });
const SHORTCUT_URL = ''; // iCloud link of the shared iPhone shortcut, once created
const fmtCode = c => (c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/(.{4})(?=.)/g, '$1-');
function installBanner(){
  if (IN_APP || STANDALONE || demo || store.get('hideInstall') || !(IS_IOS || IS_ANDROID)) return '';
  return `<section class="card install"><h3>Als App installieren</h3>
    ${IS_IOS ? `<ol><li>Unten in Safari auf <b>Teilen</b> <svg viewBox="0 0 24 24" class="ico"><path d="M12 3v12M7 8l5-5 5 5M5 12v8h14v-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> tippen.</li>
        <li>Nach unten scrollen: <b>Zum Home-Bildschirm</b>.</li>
        <li>Die App vom Home-Bildschirm öffnen und dort mit deinem <b>Zugangscode</b> anmelden${store.get('login_code') ? `: <b class="nowrap">${esc(store.get('login_code'))}</b>` : ''}.</li></ol>
        <p class="small">Wichtig: Die App auf dem Home-Bildschirm ist auf dem iPhone von Safari getrennt. Darum brauchst du dort einmal den Zugangscode.</p>`
      : installEvt ? `<p>Ein Tipp, dann ist Hear Me Coach im Teilen-Menü von TikTok und Instagram.</p><div class="row"><button class="btn acc" id="doInstall">Jetzt installieren</button></div>`
      : `<p>Im Chrome-Menü <b>⋮</b> auf <b>App installieren</b> oder <b>Zum Startbildschirm hinzufügen</b> tippen. Danach ist Hear Me Coach im Teilen-Menü von TikTok und Instagram.</p>`}
    <div class="row" style="margin-top:8px"><button class="btn alt" id="hideInstall">Ausblenden</button></div></section>`;
}
function codeBanner(){
  if (demo || store.get('login_code')) return '';
  return `<section class="card install"><h3>Sichere deinen Zugangscode</h3>
    <p>Damit du dein Profil in der App oder auf einem neuen Handy behältst, brauchst du einen persönlichen Zugangscode. Das dauert 10 Sekunden.</p>
    <div class="row"><button class="btn acc" id="mkCode">Zugangscode anzeigen</button></div>
    <p class="small">Falls du schon einen Code hast, wird er dadurch ersetzt.</p></section>`;
}
function bindInstall(){
  const mc = $('#mkCode'); if (mc) mc.onclick = async () => { try { showCodeSheet(await api.call('new_login_code', {p_token:token()}), true); } catch (e) { toast(e.message); } };
  const d = $('#doInstall'); if (d) d.onclick = async () => { installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; render(); };
  const h = $('#hideInstall'); if (h) h.onclick = () => { store.set('hideInstall', true); render(); };
}
function showCodeSheet(code, first){
  if (!demo) store.set('login_code', code);
  if (S.me) render();
  S.lockSheet = true;
  sheet(`<h2>${first ? 'Wichtig: Dein persönlicher Zugangscode' : 'Dein neuer Zugangscode'}</h2>
    <p>Mit diesem Code meldest du dich wieder an: in der Hear-Me-Coach-App, auf einem neuen Handy oder wenn der Browser-Speicher gelöscht wurde. <b>Ohne den Code ist dein Profil mit deinen Videos und Upvotes nicht wiederherstellbar.</b></p>
    <div class="code codebox">${esc(code)}</div>
    <div class="row"><button class="btn acc" id="cpCode">Code kopieren</button>${navigator.share ? '<button class="btn alt" id="shCode">In Notizen speichern …</button>' : ''}</div>
    <p class="small" style="margin-top:10px">Am einfachsten: Bildschirmfoto machen oder in den Notizen speichern. Gib den Code nicht weiter, er ist wie ein Passwort.</p>
    <label class="switch ack"><input type="checkbox" id="ackCode"> Ich habe meinen Code gespeichert</label>
    <div class="row" style="margin-top:12px"><button class="btn" id="codeDone" disabled>Weiter</button></div>`);
  $('#cpCode').onclick = async () => { try { await navigator.clipboard.writeText(code); toast('Code kopiert – jetzt in Notizen einfügen'); } catch { toast('Bitte abschreiben: ' + code); } };
  const sh = $('#shCode'); if (sh) sh.onclick = () => navigator.share({title:'Hear Me Coach Zugangscode', text:`Mein Hear-Me-Coach-Zugangscode${S.me ? ' (' + S.me.team.name + ')' : ''}: ${code}\n${APP_URL}`}).catch(() => {});
  $('#ackCode').onchange = e => { $('#codeDone').disabled = !e.target.checked; };
  $('#codeDone').onclick = () => { S.lockSheet = false; closeSheet(); handleShare(); };
}

// ---------- invitations ----------
const APP_URL = location.origin + location.pathname.replace(/index\.html$/, '');
const inviteUrl = code => APP_URL + '?code=' + encodeURIComponent(code);
function qrSvg(text){
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:2, scalable:true}); }
  catch { return ''; }
}
function showInviteQr(){
  const t = S.me.team, url = inviteUrl(t.player_code);
  sheet(`<div class="qrbig"><h2>${esc(t.name)}</h2><p>Mit der Handy-Kamera scannen und beitreten</p>
    <div class="qrbox">${qrSvg(url)}</div><div class="code" style="font-size:28px">${esc(t.player_code)}</div>
    <p class="small">${esc(url)}</p><div class="row" style="justify-content:center"><button class="btn alt" data-close>Schließen</button></div></div>`);
}

// ---------- native app bridge (Hear Me Coach app wraps this page in a WebView) ----------
const IN_APP = !!window.ReactNativeWebView;
const toNative = msg => { try { window.ReactNativeWebView.postMessage(JSON.stringify(msg)); } catch {} };
window.hmcNative = {
  // native -> web: a link was shared into the app from TikTok, Instagram, YouTube …
  share(text){ const u = firstUrl(text); if (!u) return; if (S.me) { closeSheet(); openShare(u); } else pendingShare = u; },
  // native -> web: Expo push token after permission was granted
  async pushToken(pt, platform){ store.set('push_token', pt);
    if (S.me && !demo) { try { await api.call('register_push', {p_token:token(), p_push_token:pt, p_platform:platform}); } catch (e) { toast(e.message); } } },
  // native -> web: notification tapped
  open(tab){ if (!S.me) return; if (tab) S.tab = tab; closeSheet(); load(); },
  pushDenied(){ toast('Benachrichtigungen sind in den Handy-Einstellungen ausgeschaltet.'); },
};
function nativeLoggedIn(){ if (IN_APP && S.me && !demo) toNative({type:'loggedIn', team:S.me.team.name}); }

// ---------- share target ----------
let pendingShare = '';
function handleShare(){
  if (pendingShare && S.me) { const u = pendingShare; pendingShare = ''; openShare(u); }
}

// ---------- start ----------
async function start(){
  const q = new URLSearchParams(location.search);
  pendingShare = firstUrl([q.get('url'), q.get('text'), q.get('title')].join(' '));
  if (pendingShare) history.replaceState(null, '', location.pathname);
  let reachable = !q.has('demo');
  if (reachable) { try { await fetch(CFG.url + '/rest/v1/', {headers:{apikey:CFG.key}, method:'HEAD'}); } catch { reachable = false; } }
  if (!reachable) {
    const demos = {team: makeDemo('team'), solo: makeDemo('solo'), fresh: makeDemo('fresh')};
    let cur = 'team:c';
    demo = demos.team; api = demo;
    const bar = $('#demo'); bar.hidden = false;
    const opt = (v, l) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`;
    demoHooks.refresh = () => {
      if (demo === demos.fresh && demos.fresh.members.length) cur = 'fresh:' + (demos.fresh.members.find(m => m.id === 'c') || demos.fresh.members[demos.fresh.members.length - 1]).id;
      const f = demos.fresh.team;
      bar.innerHTML = `<b>Demo</b> Ansicht als: <select id="who">
        <optgroup label="Mannschaft (Volleyball)">${demos.team.members.map(m => opt('team:' + m.id, m.name + (m.role === 'coach' ? ' (Coach)' : ''))).join('')}</optgroup>
        <optgroup label="Allein trainieren">${opt('solo:s', 'Jan (Kraftsport, solo)')}</optgroup>
        <optgroup label="Selbst ausprobieren">${opt('fresh:', 'Von vorn starten (leer)')}
          ${f ? demos.fresh.members.map(m => opt('fresh:' + m.id, (f.mode === 'solo' ? 'Deine Sammlung: ' : f.name + ': ') + m.name + (m.role === 'coach' && f.mode !== 'solo' ? ' (Coach)' : ''))).join('') : ''}</optgroup></select>`;
      $('#who').onchange = async e => { const [k, id] = e.target.value.split(':'); cur = e.target.value;
        if (k === 'fresh' && !id) return demoHooks.fresh();
        demo = demos[k]; api = demo; demo.setMe(id);
        S.tab = k === 'solo' ? 'all' : (demo.members.find(m => m.id === id) || {}).role === 'coach' ? (demo.team.mode === 'solo' ? 'all' : 'coach') : 'pool';
        S.cat = ''; S.log = null; await load(); };
    };
    demoHooks.fresh = () => { demos.fresh = makeDemo('fresh'); demo = demos.fresh; api = demo; cur = 'fresh:';
      S.me = null; S.posts = []; S.log = null; S.cat = ''; demoHooks.refresh(); render(); scrollTo(0, 0); };
    demoHooks.refresh();
    S.tab = 'coach'; await load(); return;
  }
  const ic = (q.get('code') || '').trim().toUpperCase();
  if (ic && !store.get('token')) {
    try { const t = await api.call('team_preview', {p_code:ic}); if (t) { S.invite = t; S.inviteCode = ic; } else toast('Einladungs-Code nicht gefunden. Frag deinen Coach nach dem richtigen Link.'); } catch {}
  }
  if (store.get('token')) { await load(); handleShare(); } else render();
  setInterval(() => { if (S.me && !document.hidden && !$('#sheet').classList.contains('open')) load(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) load(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
start();
}
</script>
</body>
</html>
