<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hear Me Coach</title>
<meta name="theme-color" content="#0b4d33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: sideline clipboard, quick and friendly, calm
   IDEA: the club's own colours on a clean team sheet; the header carries the sport's field markings
   PICTURE: the live pool of shared clips with upvote meters filling toward the coach line
   COLOUR and TYPE: team colour band (from sport or club), quiet paper, signal coral accent; Barlow Condensed + Barlow
   LAYOUT: app shell, coloured top band, tabs on paper, single card column, floating share button */
:root{color-scheme:light dark;
  --bg:#1f6b46;--chalk:#ffffff; /* team colour + text on it, set by applyTheme() */
  --paper:light-dark(#f4f5f2,#0f1311);
  --card:light-dark(#ffffff,#182019);--ink:light-dark(#151a17,#e8eee9);--soft:light-dark(#5d6862,#9fb0a6);
  --line:light-dark(#e2e6e1,#2a352e);--acc:#ff5a3c;--acc2:light-dark(#ffe9e3,#3a1d16);
  --ok:light-dark(#0f7a4a,#5fd39a);--okbg:light-dark(#e6f4ec,#12321f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;font-size:16px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:16px max(4vw,14px) 18px;
  background:var(--bg);color:var(--chalk)}
.top .motif{position:absolute;right:-10px;top:-10px;height:calc(100% + 20px);width:auto;opacity:.16;pointer-events:none}
.top .logo{flex:none;width:52px;height:52px;border-radius:14px;object-fit:contain;background:#fff;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.top .mark{flex:none;width:44px;height:44px}
.top .names{position:relative;min-width:0}
.top h1{font-size:26px;letter-spacing:.01em;overflow-wrap:anywhere}
.top .sub{font-size:14px;opacity:.85}
.tabs{display:flex;gap:6px;padding:10px max(4vw,14px);overflow-x:auto;position:sticky;top:0;z-index:4;
  background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tab{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-weight:600}
.tab[aria-selected=true]{background:var(--bg);color:var(--chalk);border-color:var(--bg)}
.tab .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px}
main{max-width:720px;margin:0 auto;padding:6px max(4vw,14px) 120px}
.hint{color:var(--soft);font-size:14px;margin:14px 2px 12px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 14px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05)}
.post{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px}
.thumb{width:96px;height:128px;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#fff;
  font-family:"Barlow Condensed";font-weight:700;font-size:18px;text-decoration:none;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .pl{position:absolute;left:6px;bottom:6px;font-size:12px;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px}
.p-tiktok{background:linear-gradient(150deg,#111 40%,#25f4ee 60%,#fe2c55)}
.p-instagram{background:linear-gradient(140deg,#feda75,#d62976 55%,#4f5bd5)}
.p-youtube{background:#e62117}.p-facebook{background:#1877f2}.p-web{background:#4b5a52}
.meta{font-size:14px;color:var(--soft);display:flex;flex-wrap:wrap;gap:4px 10px}
.title{font-size:19px;font-weight:600;margin:2px 0 4px;overflow-wrap:anywhere}
.comment{margin:4px 0 8px;font-size:15px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:13px;font-weight:600;background:var(--line);color:var(--ink)}
.s-relevant{background:var(--acc2);color:var(--acc)}.s-adopted{background:var(--okbg);color:var(--ok)}
.s-rejected{background:var(--line);color:var(--soft)}.s-seen{background:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vote{display:flex;align-items:center;gap:10px;margin-top:8px}
.up{min-height:44px;min-width:76px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font-weight:700}
.up[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.up:disabled{opacity:.5;cursor:default}
.meter{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:4px;transition:width .3s}
.mlab{font-size:13px;color:var(--soft);white-space:nowrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--bg);color:var(--chalk);font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.acc{background:var(--acc);color:#fff}
.link{color:inherit;font-weight:600}
.fab{position:fixed;right:max(4vw,16px);bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;min-height:56px;padding:0 22px;border-radius:999px;
  border:0;background:var(--acc);color:#fff;font-weight:700;font-size:17px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=url],input[type=number],textarea,select{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.switch{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--acc)}
.small{font-size:14px;color:var(--soft)}
.sheet{position:fixed;inset:0;z-index:10;display:none;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .card{width:min(640px,100%);margin:0;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:28px}
.review{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--line)}
.stars button{min-width:44px;min-height:44px;border:0;background:transparent;font-size:26px;color:var(--line);padding:0}
.stars button.on{color:#f5a623}
.empty{color:var(--soft);text-align:center;padding:40px 10px}.empty h2{color:var(--ink)}
.empty h2{font-size:30px;margin-bottom:6px}
.code{font-family:"Barlow Condensed";font-size:34px;letter-spacing:.12em;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:20;background:#13201a;color:#fff;padding:10px 16px;border-radius:12px;
  font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
.demo[hidden]{display:none}
.demo{background:var(--acc);color:#fff;font-size:14px;padding:8px max(4vw,14px);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo select{width:auto;min-height:36px;padding:4px 8px;font-size:15px}
.hero{color:#fff;background:var(--bg);margin:0 calc(-1 * max(4vw,14px)) 16px;padding:28px max(4vw,14px) 18px}
.hero h1{font-size:clamp(40px,10vw,56px)}
.hero p{font-size:18px;opacity:.9;max-width:34em}
.board{display:block;width:100%;height:auto;margin:10px 0 6px}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pick{min-height:40px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600}
.pick[aria-pressed=true]{background:var(--bg);border-color:var(--bg);color:var(--chalk)}
.pick.new{border-style:dashed}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.filters .pick{flex:none;background:var(--card)}
.filters .pick[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.cat{display:inline-block;padding:1px 8px;border-radius:6px;font-size:13px;font-weight:600;background:var(--bg);color:var(--chalk)}
.catlist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.catlist span{display:inline-flex;align-items:center;gap:2px;padding-left:12px;border-radius:999px;border:1.5px solid var(--line);font-weight:600}
.stars.mini{display:flex;margin-top:4px}.stars.mini button{min-width:40px;min-height:40px;font-size:24px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.kpis div{background:var(--okbg);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.kpis b{font-family:"Barlow Condensed";font-size:clamp(28px,8vw,40px);line-height:1;color:var(--ok)}
.kpis span{font-size:13px;color:var(--soft)}
@media(max-width:420px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.weeks{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:170px;align-items:end;margin-top:10px}
.wk{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.wk i{display:block;width:100%;max-width:26px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.wn{font-size:13px;font-weight:600;color:var(--soft)}.wl{font-size:11px;color:var(--soft);margin-top:4px;white-space:nowrap}
@media(max-width:420px){.wl{font-size:9px}}
.bar{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.5em;gap:8px;align-items:center;margin:8px 0}
.bar div{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bg)}
.bar b{text-align:right}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top5{margin:8px 0;padding-left:1.4em}.top5 li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.top5 b{white-space:nowrap}
.catlist button{min-width:40px;min-height:40px;border:0;background:transparent;color:var(--soft);font-size:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="demo" class="demo" hidden></div>
<div id="app"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true"><div class="card" id="sheetBody"></div></div>
<div id="toast" class="toast" role="status"></div>
<script>
{
const CFG = {
  url: 'https://ikmuivznwysbxlwxzxrd.supabase.co',
  key: 'sb_publishable_ptC5If9CNCCN_UxoGGVLfA_LMU9o_QM'
};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem('hmc_'+k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem('hmc_'+k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem('hmc_'+k); } catch {} }
};
const ERR = {invalid_code:'Code nicht gefunden.', not_authorized:'Bitte neu beitreten.', invalid_url:'Das sieht nicht wie ein Link aus.',
  own_post:'Eigene Beiträge kannst du nicht upvoten.', coach_only:'Nur für den Coach.', not_allowed:'Das darfst du nicht.', not_found:'Beitrag nicht gefunden.'};
const STATUS = {new:'Neu', relevant:'Beim Coach', seen:'Angeschaut', adopted:'Ins Training aufgenommen', rejected:'Abgelehnt'};
const PL = {tiktok:'TikTok', instagram:'Instagram', youtube:'YouTube', facebook:'Facebook', web:'Link'};

// ---------- backend: Supabase RPC ----------
const remote = {
  async call(fn, args){
    const r = await fetch(`${CFG.url}/rest/v1/rpc/${fn}`, {method:'POST',
      headers:{'apikey':CFG.key,'Content-Type':'application/json'}, body:JSON.stringify(args)});
    const t = await r.text(); const j = t ? JSON.parse(t) : null;
    if (!r.ok) { const m = (j && j.message) || 'Fehler'; throw new Error(ERR[m] || m); }
    return j;
  }
};

// ---------- backend: in-browser demo (same API) ----------
function makeDemo(kind){
  const now = Date.now(), h = 36e5, d = 24*h;
  const solo = kind === 'solo';
  const team = solo
    ? {id:'t2', name:'Mein Training', sport:'Kraftsport', mode:'solo', threshold:3, player_code:null, coach_code:null,
       categories:['Aufwärmen','Brust','Rücken','Schultern','Arme','Beine','Core','Cardio','Dehnen']}
    : {id:'t1', name:'Damen 1 TV Musterstadt', sport:'Volleyball', mode:'team', threshold:3, player_code:'KICK42', coach_code:'COACH7',
       categories:['Aufwärmen','Technik','Spielform','Taktik','Abschluss','Kondition','Ausklang']};
  const members = solo ? [{id:'s', name:'Jan', role:'coach'}] : [
    {id:'c', name:'Coach Kim', role:'coach'}, {id:'a', name:'Alina', role:'player'},
    {id:'b', name:'Bea', role:'player'}, {id:'d', name:'Dana', role:'player'}, {id:'e', name:'Elif', role:'player'}];
  let posts = solo ? [
    {id:'g1', url:'https://www.tiktok.com/@gym/video/11', platform:'tiktok', title:'Bankdrücken mit Pause auf der Brust', category:'Brust', comment:'', by:'s', status:'adopted', t:now-70*d, votes:[], review:{stars:5}},
    {id:'g2', url:'https://www.instagram.com/reel/g2', platform:'instagram', title:'Rudern einarmig, Fokus Schulterblatt', category:'Rücken', comment:'', by:'s', status:'adopted', t:now-60*d, votes:[], review:{stars:4}},
    {id:'g3', url:'https://www.youtube.com/shorts/g3abc12', platform:'youtube', title:'Bulgarian Split Squats sauber', category:'Beine', comment:'Knie über Fuß', by:'s', status:'adopted', t:now-50*d, votes:[], review:{stars:5}},
    {id:'g4', url:'https://www.tiktok.com/@gym/video/14', platform:'tiktok', title:'Hollow Hold Progression', category:'Core', comment:'', by:'s', status:'seen', t:now-30*d, votes:[], review:{stars:3}},
    {id:'g5', url:'https://www.instagram.com/reel/g5', platform:'instagram', title:'Bizeps-Curls mit Band', category:'Arme', comment:'Fand ich langweilig', by:'s', status:'rejected', t:now-20*d, votes:[], review:{stars:2}},
    {id:'g6', url:'https://www.tiktok.com/@mobility/video/16', platform:'tiktok', title:'Hüfte öffnen in 5 Minuten', category:'Dehnen', comment:'', by:'s', status:'new', t:now-2*d, votes:[]}]
  : [
    {id:'p1', url:'https://www.tiktok.com/@trainingdrills/video/1', platform:'tiktok', title:'Annahme unter Druck, drei Bälle hintereinander', category:'Technik', comment:'Unsere Annahme bricht im dritten Satz immer ein.', anonymous:false, by:'a', status:'relevant', t:now-30*h, votes:['b','d','e']},
    {id:'p2', url:'https://www.instagram.com/reel/abc', platform:'instagram', title:'Mobilisation mit Band vor dem Spiel', category:'Aufwärmen', comment:'', anonymous:true, by:'b', status:'new', t:now-5*h, votes:['a']},
    {id:'p3', url:'https://www.youtube.com/shorts/xyz123', platform:'youtube', title:'Block-Timing gegen den schnellen Angriff', category:'Taktik', comment:'Könnten wir vor dem Spiel am Samstag testen.', anonymous:false, by:'d', status:'adopted', t:now-80*h, votes:['a','b','e'],
      review:{stars:5, note:'Kommt Dienstag in Block 2, 15 Minuten.', note_public:true}},
    {id:'p4', url:'https://www.tiktok.com/@athletik/video/2', platform:'tiktok', title:'Sprungkraft-Zirkel ohne Geräte', category:'Kondition', comment:'Für die Vorbereitung', anonymous:true, by:'e', status:'new', t:now-2*h, votes:[]}];
  // seeded workout log: a believable rhythm over the last ~10 weeks
  let logs = [];
  if (solo) {
    const plan = [['g1',3],['g2',3],['g3',4],['g4',6]];
    for (let day = 68; day >= 1; day--) for (const [id, every] of plan)
      if (day % every === 0 && posts.find(p => p.id === id).t < now - day*d) logs.push({post_id:id, by:'s', t:now - day*d + 18*h});
  } else {
    [5,3,1].forEach(day => logs.push({post_id:'p3', by:'c', t:now - day*d}));
  }
  const ensureCat = n => { n = String(n || '').trim().replace(/\s+/g, ' ').slice(0, 30); if (!n) return null;
    const ex = team.categories.find(c => c.toLowerCase() === n.toLowerCase()); if (ex) return ex; team.categories.push(n); return n; };
  const name = id => members.find(m => m.id === id)?.name;
  let me = members[0].id;
  const api = {
    setMe(id){ me = id; }, members,
    async call(fn, a){
      await new Promise(r => setTimeout(r, 80));
      const m = members.find(x => x.id === me), coach = m.role === 'coach';
      const find = id => { const p = posts.find(x => x.id === id); if (!p) throw new Error(ERR.not_found); return p; };
      const mine = id => logs.filter(l => l.post_id === id && l.by === me);
      switch (fn) {
        case 'whoami': return {member_id:m.id, name:m.name, role:m.role, team:{...team, categories:[...team.categories], coach_code: coach ? team.coach_code : null}};
        case 'set_team': if (!coach) throw new Error(ERR.coach_only); if (a.p_name) team.name = a.p_name; if (a.p_sport) team.sport = a.p_sport; return null;
        case 'set_team_style': if (!coach) throw new Error(ERR.coach_only);
          if (a.p_color != null) team.color = a.p_color || null; if (a.p_logo != null) team.logo = a.p_logo || null; return null;
        case 'add_category': if (!coach) throw new Error(ERR.coach_only); ensureCat(a.p_name); return null;
        case 'delete_category': if (!coach) throw new Error(ERR.coach_only); team.categories = team.categories.filter(c => c.toLowerCase() !== a.p_name.toLowerCase()); return null;
        case 'set_post_category': { const p = find(a.p_post_id); if (p.by !== me && !coach) throw new Error(ERR.not_allowed); p.category = ensureCat(a.p_category); return null; }
        case 'list_posts': return posts.slice().sort((x,y) => y.t - x.t).map(p => ({
          id:p.id, url:p.url, platform:p.platform, title:p.title, thumbnail_url:null, comment:p.comment, category:p.category || null, anonymous:!!p.anonymous,
          status:p.status, created_at:new Date(p.t).toISOString(), mine:p.by === me,
          submitter: (!p.anonymous || coach || p.by === me) ? name(p.by) : null,
          upvotes:p.votes.length, voted:p.votes.includes(me), voters: coach ? p.votes.map(name) : null,
          done_count:mine(p.id).length, last_done: mine(p.id).length ? new Date(Math.max(...mine(p.id).map(l => l.t))).toISOString() : null,
          review: p.review ? {stars:p.review.stars, note:(coach || p.review.note_public) ? p.review.note : null,
            note_public:p.review.note_public, reason:(coach || p.by === me) ? p.review.reason : null} : null }));
        case 'add_post': {
          if (!/^https?:\/\/\S+$/i.test(a.p_url)) throw new Error(ERR.invalid_url);
          const key = urlKey(a.p_url), dup = posts.find(p => urlKey(p.url) === key);
          if (dup) return {id:dup.id, duplicate:true};
          const id = 'p' + Math.random().toString(36).slice(2);
          posts.push({id, url:a.p_url, platform:platformOf(a.p_url), title:a.p_title, comment:a.p_comment, category:ensureCat(a.p_category), anonymous:a.p_anonymous, by:me, status:'new', t:Date.now(), votes:[]});
          return {id, duplicate:false};
        }
        case 'toggle_upvote': {
          const p = find(a.p_post_id); if (p.by === me) throw new Error(ERR.own_post);
          p.votes = p.votes.includes(me) ? p.votes.filter(v => v !== me) : [...p.votes, me];
          if (p.status === 'new' && p.votes.length >= team.threshold) p.status = 'relevant';
          return {upvotes:p.votes.length};
        }
        case 'delete_post': { const p = find(a.p_post_id); if (p.by !== me && !coach) throw new Error(ERR.not_allowed); posts = posts.filter(x => x !== p); logs = logs.filter(l => l.post_id !== p.id); return null; }
        case 'review_post': { if (!coach) throw new Error(ERR.coach_only); const p = find(a.p_post_id); p.status = a.p_status;
          p.review = {stars:a.p_stars, note:a.p_note, note_public:a.p_note_public, reason:a.p_reason}; return null; }
        case 'rate_post': { if (!coach) throw new Error(ERR.coach_only); const p = find(a.p_post_id); p.review = {...(p.review || {}), stars:a.p_stars}; return null; }
        case 'log_workout': { find(a.p_post_id); logs.push({post_id:a.p_post_id, by:me, t:Date.now()}); return {count:mine(a.p_post_id).length}; }
        case 'undo_workout': { const l = mine(a.p_post_id).sort((x,y) => y.t - x.t)[0]; logs = logs.filter(x => x !== l); return null; }
        case 'list_my_log': return logs.filter(l => l.by === me).sort((x,y) => y.t - x.t).map(l => { const p = posts.find(x => x.id === l.post_id) || {};

async function preview(u){

  } catch { return {}; }
}

function readLogo(file){
  return new Promise((res, rej) => {
    if (!/^image\/(png|jpeg|webp|svg\+xml|gif)$/.test(file.type)) return rej(new Error('Bitte ein Bild (PNG, JPG, WebP) wählen.'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 256 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k) || 1; c.height = Math.round(img.height * k) || 1;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let d = c.toDataURL('image/webp', .85); if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/png'); res(d); };
    img.onerror = () => rej(new Error('Bild konnte nicht gelesen werden.')); img.src = url; });
}

// ---------- statistics (computed from my own log) ----------
function weekStart(t){ const d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
function statsView(){

  const now = Date.now(), W = 7*864e5, thisWeek = weekStart(now);
  const weeks = Array.from({length:12}, (_, i) => weekStart(thisWeek - (11 - i) * W + 432e5)); // +12h keeps DST shifts inside the right week
  const perWeek = weeks.map(w => log.filter(l => weekStart(Date.parse(l.done_at)) === w).length);
  const days = new Set(log.map(l => new Date(l.done_at).toDateString()));
  const daysThisWeek = new Set(log.filter(l => Date.parse(l.done_at) >= thisWeek).map(l => new Date(l.done_at).toDateString())).size;
  let streak = 0; for (let i = perWeek.length - 1; i >= 0; i--) { if (perWeek[i]) streak++; else if (i === perWeek.length - 1) continue; else break; }
  const count = key => Object.entries(log.reduce((m, l) => { const k = l[key] || 'Ohne Kategorie'; m[k] = (m[k] || 0) + 1; return m; }, {})).sort((a,b) => b[1] - a[1]);
  const byCat = count('category');
  const byPost = Object.values(log.reduce((m, l) => { (m[l.post_id] = m[l.post_id] || {title:l.title || 'Video', n:0, last:l.done_at}).n++; return m; }, {})).sort((a,b) => b.n - a.n).slice(0, 5);
  const max = Math.max(1, ...perWeek), maxC = Math.max(1, ...byCat.map(c => c[1]));
  const lastDays = [...days].map(d => Date.parse(d)).sort((a,b) => b - a);
  const stale = S.posts.filter(p => p.status !== 'rejected' && p.done_count && Date.parse(p.last_done) < now - 14*864e5);
  return `<section class="card"><h2 style="font-size:26px">Dein Training</h2>
      <div class="kpis">
        <div><b>${days.size}</b><span>Trainingstage</span></div>
        <div><b>${log.length}</b><span>Übungen gemacht</span></div>
        <div><b>${daysThisWeek}</b><span>Tage diese Woche</span></div>
        <div><b>${streak}</b><span>Wochen in Folge</span></div></div>
      <p class="small">Letztes Training: ${lastDays.length ? new Date(lastDays[0]).toLocaleDateString('de-DE', {weekday:'long', day:'2-digit', month:'2-digit'}) : '–'}</p></section>
    <section class="card"><h3 style="font-size:22px">Übungen pro Woche</h3>
      <div class="weeks" role="img" aria-label="Übungen pro Woche, letzte 12 Wochen">
        ${perWeek.map((n, i) => `<div class="wk"><span class="wn">${n || ''}</span><i style="height:${n / max * 100}%"></i>
          <span class="wl">${i === 11 ? 'jetzt' : 'KW' + kw(weeks[i])}</span></div>`).join('')}</div></section>
    <section class="card"><h3 style="font-size:22px">Nach Kategorie</h3>
      ${byCat.map(([c, n]) => `<div class="bar"><span>${esc(c)}</span><div><i style="width:${n / maxC * 100}%"></i></div><b>${n}</b></div>`).join('')}</section>
    <section class="card"><h3 style="font-size:22px">Am häufigsten</h3>
      <ol class="top5">${byPost.map(p => `<li><span>${esc(p.title)}</span><b>${p.n}×</b></li>`).join('')}</ol>
      ${stale.length ? `<p class="small"><b>Länger nicht gemacht:</b> ${stale.slice(0, 4).map(p => esc(p.title || 'Video')).join(', ')}</p>` : ''}</section>`;
}
function kw(t){ const d = new Date(t); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); const y = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - y) / 864e5 - 3 + ((y.getDay() + 6) % 7)) / 7); }

function bindTeam(){
  const ci = $('#copyInvite'); if (ci) ci.onclick = async () => {
    const txt = `Komm in unseren Trainings-Pool bei Hear Me Coach: ${location.href.split('?')[0].split('#')[0]} – Code: ${S.me.team.player_code}`;

  const sv = $('#saveTh'); if (sv) sv.onclick = async () => {
    const n = parseInt($('#th').value, 10); if (!(n >= 1 && n <= 100)) return toast('Zahl zwischen 1 und 100');
    try { await api.call('set_threshold', {p_token:token(), p_threshold:n}); toast('Gespeichert'); await load(); } catch (e) { toast(e.message); } };
  if (S.me.role === 'coach') {
    const sport = bindSportPicker();
    $('#saveTeam').onclick = async () => {
      try { await api.call('set_team', {p_token:token(), p_name:$('#tn2').value, p_sport:sport()}); toast('Gespeichert'); await load(); } catch (e) { toast(e.message); } };
    const style = async (c, l) => { try { await api.call('set_team_style', {p_token:token(), p_color:c, p_logo:l}); toast('Gespeichert'); await load(); } catch (e) { toast(e.message); } };

    const dl = $('#delLogo'); if (dl) dl.onclick = () => style(null, '');
    $('#addCat').onclick = async () => { const n = $('#newCat').value.trim(); if (!n) return;
      try { await api.call('add_category', {p_token:token(), p_name:n}); await load(); } catch (e) { toast(e.message); } };

// ---------- sheets ----------
function sheet(html){ $('#sheetBody').innerHTML = html; $('#sheet').classList.add('open'); }
function closeSheet(){ $('#sheet').classList.remove('open'); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet' || e.target.dataset.close != null) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function confirmSheet(title, text, label, fn){
  sheet(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row"><button class="btn acc" id="ok">${esc(label)}</button><button class="btn alt" data-close>Abbrechen</button></div>`);
  $('#ok').onclick = async () => { try { await fn(); closeSheet(); } catch (e) { toast(e.message); } };
}

function openShare(prefill){
  const solo = isSolo();
  sheet(`<h2>${solo ? 'Video speichern' : 'Hear me, Coach!'}</h2>
    <form id="shareForm">
      <label for="u">Link zum Video</label>
      <input id="u" type="url" inputmode="url" placeholder="https://www.tiktok.com/…" value="${esc(prefill)}" required>
      <p class="small" id="pv"></p>
      <label for="ti">Titel <span class="small">(was ist zu sehen?)</span></label>
      <input id="ti" type="text" maxlength="200" placeholder="${solo ? 'z. B. Kniebeuge mit Pause' : 'z. B. Passübung im Dreieck'}">
      <label>Kategorie</label>${catPicker('cp', S.me.team.categories, '')}
      <label for="co">${solo ? 'Notiz' : 'Warum sollten wir das machen?'} <span class="small">(optional)</span></label>
      <textarea id="co" maxlength="500" placeholder="${solo ? 'z. B. 3 × 10, langsam runter' : ''}"></textarea>
      ${solo ? '' : `<label class="switch"><input id="an" type="checkbox"> Anonym teilen</label>
      <p class="small">Mitspieler sehen dann keinen Namen. Der Coach sieht immer, von wem es kommt.</p>`}
      <div class="row" style="margin-top:14px"><button class="btn acc" type="submit">${solo ? 'Speichern' : 'In den Pool'}</button><button class="btn alt" type="button" data-close>Abbrechen</button></div>
    </form>`);
  let pv = {}; const cat = bindCatPicker('cp');
  const check = async () => {
    const u = firstUrl($('#u').value); if (!u) return;
    $('#u').value = u; $('#pv').textContent = PL[platformOf(u)] + '-Link erkannt';
    pv = await preview(u); if (pv.title && !$('#ti').value) $('#ti').value = pv.title.slice(0, 200);
  };
  $('#u').addEventListener('change', check); $('#u').addEventListener('paste', () => setTimeout(check, 0));
  if (prefill) check(); else setTimeout(() => $('#u').focus(), 50);
  $('#shareForm').onsubmit = async e => {
    e.preventDefault();
    const u = firstUrl($('#u').value); if (!u) return toast(ERR.invalid_url);
    try {
      const r = await api.call('add_post', {p_token:token(), p_url:u, p_title:$('#ti').value, p_thumbnail_url:pv.thumb || null,
        p_comment:$('#co').value, p_anonymous: !solo && $('#an').checked, p_category:cat() || null});
      closeSheet();
      toast(r.duplicate ? (solo ? 'Das Video ist schon in deiner Sammlung.' : 'Den Link gibt es schon im Pool, gib ihm ein Upvote.')
        : (solo ? 'Gespeichert.' : 'Im Pool! Jetzt brauchst du Upvotes.'));
      S.tab = solo ? 'all' : 'pool'; await load();
    } catch (err) { toast(err.message); }
  };
}

function openReview(p){
  const r = p.review || {}, solo = isSolo(); let stars = r.stars || 0;
  sheet(`<h2>${esc(p.title || 'Beitrag')}</h2>
    <p class="small">${solo ? '' : `Geteilt von <b>${esc(p.submitter || '?')}</b>${p.anonymous ? ' (anonym für Mitspieler)' : ''} · ${p.upvotes} Upvotes · `}
      <a class="link" href="${esc(p.url)}" target="_blank" rel="noopener">Video öffnen</a></p>
    <label>Kategorie</label>${catPicker('rc', S.me.team.categories, p.category || '')}
    <label>${solo ? 'Wie gefällt dir die Übung?' : 'Deine Bewertung'}</label><div class="stars" id="st">${[1,2,3,4,5].map(i => `<button type="button" data-s="${i}" aria-label="${i} Sterne">★</button>`).join('')}</div>
    <label for="no">Notiz</label><textarea id="no" maxlength="2000" placeholder="${solo ? 'z. B. 3 × 10 mit 60 kg' : 'z. B. Dienstag Block 2, mit kleineren Feldern'}">${esc(r.note || '')}</textarea>
    ${solo ? '' : `<label class="switch"><input id="np" type="checkbox" ${r.note_public ? 'checked' : ''}> Notiz für die Mannschaft sichtbar</label>
    <label for="rs">Grund bei Ablehnung <span class="small">(sieht nur der Absender)</span></label>
    <input id="rs" type="text" maxlength="300" value="${esc(r.reason || '')}">`}
    <div class="row" style="margin-top:16px">
      <button class="btn acc" data-st="adopted">${solo ? '♥ Favorit' : 'Ins Training'}</button>
      <button class="btn" data-st="seen">${solo ? 'Okay' : 'Angeschaut'}</button>
      <button class="btn alt" data-st="rejected">${solo ? 'Nicht meins' : 'Ablehnen'}</button></div>`);
  const cat = bindCatPicker('rc');
  const paint = () => document.querySelectorAll('#st [data-s]').forEach(b => b.classList.toggle('on', +b.dataset.s <= stars));
  document.querySelectorAll('#st [data-s]').forEach(b => b.onclick = () => { stars = +b.dataset.s; paint(); }); paint();
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
    try {
      await api.call('review_post', {p_token:token(), p_post_id:p.id, p_status:b.dataset.st, p_stars:stars || null,
        p_note:$('#no').value, p_note_public: solo ? false : $('#np').checked, p_reason: solo ? null : $('#rs').value});
      if ((cat() || '') !== (p.category || '') && cat()) await api.call('set_post_category', {p_token:token(), p_post_id:p.id, p_category:cat()});
      closeSheet(); toast('Gespeichert'); await load();
    } catch (e) { toast(e.message); } });
}

function bindOnboarding(){
  const done = r => { store.set('token', r.token); S.tab = r.team.mode === 'solo' ? 'all' : r.role === 'coach' ? 'coach' : 'pool'; load().then(handleShare); };
  $('#joinForm').onsubmit = async e => { e.preventDefault();
    try { done(await api.call('join_team', {p_code:$('#jc').value, p_name:$('#jn').value})); } catch (err) { toast(err.message); } };
  const sport = bindSportPicker();
  $('#createForm').onsubmit = async e => { e.preventDefault();
    if (!sport()) return toast('Bitte eine Sportart eingeben.');
    try { done(await api.call('create_team', {p_team_name:$('#tn').value, p_coach_name:$('#cn').value, p_sport:sport(), p_mode:'team'})); } catch (err) { toast(err.message); } };
  const ssport = bindSportPicker('ssp');
  $('#soloForm').onsubmit = async e => { e.preventDefault();
    if (!ssport()) return toast('Bitte eine Sportart eingeben.');
    try { done(await api.call('create_team', {p_team_name:'Mein Training', p_coach_name:$('#sn').value, p_sport:ssport(), p_mode:'solo'})); } catch (err) { toast(err.message); } };
  const code = new URLSearchParams(location.search).get('code'); if (code) $('#jc').value = code;
}

// ---------- share target ----------
let pendingShare = '';
function handleShare(){
  if (pendingShare && S.me) { const u = pendingShare; pendingShare = ''; openShare(u); }
}

// ---------- start ----------
async function start(){
  const q = new URLSearchParams(location.search);
  pendingShare = firstUrl([q.get('url'), q.get('text'), q.get('title')].join(' '));
  if (pendingShare) history.replaceState(null, '', location.pathname);
  let reachable = !q.has('demo');
  if (reachable) { try { await fetch(CFG.url + '/rest/v1/', {headers:{apikey:CFG.key}, method:'HEAD'}); } catch { reachable = false; } }
  if (!reachable) {
    const demos = {team: makeDemo('team'), solo: makeDemo('solo')};
    demo = demos.team; api = demo;
    const bar = $('#demo'); bar.hidden = false;
    bar.innerHTML = `<b>Demo</b> mit Beispieldaten. Ansicht als: <select id="who">
      <optgroup label="Mannschaft (Volleyball)">${demos.team.members.map(m => `<option value="team:${m.id}">${esc(m.name)}${m.role === 'coach' ? ' (Coach)' : ''}</option>`).join('')}</optgroup>
      <optgroup label="Allein trainieren"><option value="solo:s">Jan (Kraftsport, solo)</option></optgroup></select>`;
    $('#who').onchange = async e => { const [k, id] = e.target.value.split(':'); demo = demos[k]; api = demo; demo.setMe(id);
      S.tab = k === 'solo' ? 'all' : id === 'c' ? 'coach' : 'pool'; S.cat = ''; S.log = null; await load(); };
    S.tab = 'coach'; await load(); return;
  }
  if (store.get('token')) { await load(); handleShare(); } else render();
  setInterval(() => { if (S.me && !document.hidden && !$('#sheet').classList.contains('open')) load(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) load(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
start();
}
